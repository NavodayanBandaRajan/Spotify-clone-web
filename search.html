    <title>search spotify</title>
    
    <style>
      *{
        padding: 0;
        margin: 0;
        text-align: center;
      }
      
      body{
        background-color: #000000;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
      }
      
      .heading{
        color: white;
        text-align: center;
        padding: 4px;
        margin: 11px;
      }
      
      .search{
        background: transparent;
        align-content: left;
      }
      
      .search-box{
        display:flex;
  justify-content:center;
      }
      
      .Search-heading{
        color: white;
        text-align: left;
        padding: 4px;
        margin: 6px;
        margin-left: 7px;
      }
      
      .search input{
  outline: none;
  width:90vw;
  height:50px;
  border-radius:25px;
  border:1px solid white;
  background:#121212;
  color:white;
  font-size:16px;
  padding-left:15px;
}
      
     .browse-container{
       display: flex;
       flex-wrap: wrap;
       justify-content: center;
       align-items: center;
       padding: 6px;
       gap: 25px;
     }
      
     .browse-card{
       width: 140px;
       height: 70px;
       margin: 9px;
       border: solid 1px white;
       border-radius: 14px;
       background-color: purple;
       color: white;
       transition: all 0.4s ease;
     } 
      
      .browse-card:hover{
        transform: translateY(-7px);
        box-shadow: 0 4px 12px white;
      }
      
      h2{
        color: white;
        text-align: left;
        margin-top: 25px;
        margin-left: 18px;
      }
      
      h3{
        color: white;
        text-align: center;
        margin-top: 25px;
      }
      
      .search input::placeholder{
  color: #b3b3b3;
}

   .search input:focus{
  border: 1px solid #1DB954;
}
      
    </style>
    
  </head>
